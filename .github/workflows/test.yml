name: Unit Tests

on:
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/setup-uv-env
        with:
          python-version: ${{ matrix.python-version }}
          install-dev-dependencies: true
      - name: run pytest
        run: |
          uv run pytest
